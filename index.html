<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ジンライムください！</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head>
<body><main id="app">
<section id="titleScreen" class="screen"><img class="titleImage" src="title.png" alt="ジンライムください！" onerror="this.hidden=true;document.getElementById('fallbackTitle').hidden=false"><h1 id="fallbackTitle" hidden>ジンライム<br>ください！</h1><p class="intro">長押しでジンを注ぎ、ライムを搾ろう！<br>目印に合わせて離すと高得点。<br>30秒で次々つくってコンボを狙おう！</p><button id="start">開店する</button></section>
<section id="gameScreen" class="screen" hidden><header><div><span id="time">30</span> 秒</div><button id="back" class="mini">タイトルへ</button></header><div class="scoreRow"><strong><span id="score">0</span> 点</strong></div><div class="order"><div id="orderText"></div></div><canvas id="gameCanvas" width="240" height="250" aria-label="目標の点線まで注ぐグラス"></canvas><div id="feedback" aria-live="polite"></div><button id="pour" class="pour">長押しでジンを注ぐ</button></section>
<section id="resultScreen" class="screen" hidden><h2>本日の営業終了</h2><canvas id="resultCanvas" width="240" height="145"></canvas><div id="stars" class="stars"></div><div id="rank" class="rank"></div><div class="resultScore"><span id="finalScore">0</span><small> 点</small></div><div id="resultButtons" class="resultButtons hidden" inert><button id="shareButton" class="resultButton outline">Xでシェア</button><button id="registerButton" class="resultButton outline">記録を登録</button><button id="retry" class="resultButton">もう1回遊ぶ</button><button id="arcadeButton" class="resultButton outline">カバゲーセンへ</button></div></section>
</main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="game.js?v=20261009-1"></script></body></html>
